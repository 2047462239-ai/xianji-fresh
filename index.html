function crumbs(){const{page,id}=current();let a=[['home','首页']];const routes={inventory:'我的冰箱',guides:'保鲜指南',recipes:'搭配灵感',records:'消耗记录',settings:'我的',reminders:'提醒中心',feedback:'意见反馈',flow:'原型导览',cost:'每份成本'};if(routes[page])a.push([page,routes[page]]);if(['detail','edit'].includes(page)){const f=db.foods.find(f=>f.id===id);a.push(['inventory','我的冰箱'],['detail/'+id,f?.name||'食材详情']);if(page==='edit')a.push(['edit/'+id,'编辑记录'])}if(page==='add')a.push(['inventory','我的冰箱'],['add','添加食材']);if(page==='guide')a.push(['guides','保鲜指南'],['guide/'+id,guides.find(g=>g.id===id)?.name||'指南详情']);if(page==='recipe')a.push(['recipes','搭配灵感'],['recipe/'+id,recipes.find(r=>r.id===id)?.name||'搭配详情']);return a.map(([p,t],i)=>`${i?'<span style="color:#c0cbc0">/</span>':''}${i<a.length-1?`<button data-go="${p}">${esc(t)}</button>`:`<span>${esc(t)}</span>`}`).join('')}
function shell(content){return`<aside class="sidebar"><button class="brand" data-go="home" aria-label="鲜记首页"><span class="brandmark">${ic('leaf')}</span><span><span class="brandword">鲜记</span><small>FRESH KEEPER</small></span></button><div class="nav-label">我的新鲜生活</div><nav class="nav">${navButton('home','今日概览','home')}${navButton('inventory','我的冰箱','fridge',db.foods.length)}${navButton('guides','保鲜指南','leaf')}${navButton('recipes','搭配灵感','bowl')}${navButton('records','消耗记录','chart')}</nav><div class="nav-label" style="margin-top:33px">更多</div><nav class="nav">${navButton('feedback','意见反馈','chat')}${navButton('flow','原型导览','grid')}</nav><div class="side-bottom"><div class="side-tip">${ic('heart')}<h3>好好吃饭，不负新鲜</h3><p>少一点遗忘，多一份刚刚好。<br>从认真对待每一份食材开始。</p></div><button class="profile" data-go="settings"><span class="avatar">鲜</span><span><b>我的小厨房</b><small>今天也要好好生活</small></span>${ic('chevron','row-chevron')}</button></div></aside><main class="main"><header class="topbar ${current().page==='home'?'home-top':''}"><span class="mobile-brand">鲜记<span style="font-size:10px;font-weight:400;letter-spacing:1px;margin-left:8px">FRESH KEEPER</span></span><div class="crumbs">${crumbs()}</div><div class="top-right"><button class="prototype" data-go="flow">交互原型 · 体验版</button><button class="bell" data-go="reminders" aria-label="提醒中心">${ic('bell')}${db.foods.some(urgent)?'<i></i>':''}</button><button class="avatar" data-go="settings" aria-label="我的设置">鲜</button></div></header><div class="content">${content}<footer class="foot"><span>鲜记 · 让冰箱里的食材看得见、记得住、用得上</span><span>本地交互演示　/　<a href="#flow">查看页面层级</a></span></footer></div></main><nav class="mobile-nav">${navButton('home','首页','home')}${navButton('inventory','冰箱','fridge')}<button data-go="add" aria-label="添加食材"><span class="add-circle">${ic('plus')}</span><span>记录</span></button>${navButton('guides','指南','leaf')}${navButton('settings','我的','user')}</nav>`}
const head=(title,sub,action='',eye='FRESH KEEPER')=>`<div class="page-head"><div><div class="eyebrow">${eye}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;
const addBtn=()=>`<button class="btn primary" data-go="add">${ic('plus')}添加食材</button>`;
const note=()=>`<div class="notice">${ic('info')}<span>颜色与天数仅表示你设置的提醒状态。请结合包装标签、储存条件和食材实际情况判断是否适宜食用。</span></div>`;
function empty(title,sub,button=''){return`<div class="empty">${ic('leaf')}<h3>${title}</h3><p>${sub}</p>${button}</div>`}
function foodRow(f){let s=status(f);return`<button class="food-row" data-go="detail/${f.id}"><span class="food-thumb">${food(f.type)}</span><span class="food-info"><h3>${esc(f.name)} ${f.priority?'<span class="pill orange">优先</span>':''}</h3><p>${esc(f.qty)} · ${f.store} · ${shortDate(f.buy)}购入</p></span><span class="food-status"><b style="color:${s.cls==='red'?'#c77962':s.cls==='green'?'#6c9673':'#bd9055'}">${s.label}</b><small>${shortDate(f.remind)} · 提醒日期</small></span>${ic('chevron','row-chevron')}</button>`}
function home(){const soon=sorted().filter(urgent),cold=db.foods.filter(f=>f.store==='冷藏').length,frozen=db.foods.length-cold,used=db.records.filter(r=>r.action==='食用').length;const date=new Date();const weekdays=['日','一','二','三','四','五','六'];return head('晚上好，今天也要好好吃饭',`${date.getMonth()+1}月${date.getDate()}日 · 星期${weekdays[date.getDay()]}　把新鲜留在日常里`,addBtn(),'A LITTLE FRESHNESS, EVERY DAY')+`<div class="dashboard"><div><section class="hero"><h2>冰箱有数，<br>生活有鲜。</h2><p>记住每一份食材，让美味刚好发生。</p><button class="btn primary" data-go="inventory">${ic('fridge')}看看我的冰箱</button><div class="hero-art">${food('broccoli','a')}${food('carrot','b')}${food('tomato','c')}${food('eggs','d')}</div></section><div class="stats"><button class="stat" data-go="inventory"><div class="stat-label">${ic('fridge')}冰箱里的食材</div><div class="metric">${db.foods.length}<span>种</span></div><small>每一份新鲜，都有记录</small></button><button class="stat" data-action="soon"><div class="stat-label">${ic('clock')}需要优先关注</div><div class="metric">${soon.length}<span>种</span></div><small>先安排它们的食用计划</small></button><button class="stat" data-go="records"><div class="stat-label">${ic('check')}已记录食用</div><div class="metric">${used}<span>次</span></div><small>认真记录每一次消耗</small></button></div><div class="section-title"><h2>这些食材，先安排上 <span class="pill orange">${soon.length} 份待关注</span></h2><button class="textbtn" data-action="soon">查看全部</button></div><section class="panel food-list">${soon.length?soon.slice(0,3).map(foodRow).join(''):empty('今天没有待关注的食材','按需查看库存，给美味留一点空间。')}</section><p class="hint">${ic('info')}提醒状态由设定日期决定，不代表食品安全检测结果。</p><section class="home-guide"><div class="section-title"><h2>懂一点保鲜，少一点浪费</h2><button class="textbtn" data-go="guides">探索保鲜指南</button></div><div class="guides-mini"><button class="mini-guide" data-go="guide/carrot"><span><h3>耐放蔬菜，怎么选？</h3><p>从每周用量开始安排采购</p></span>${food('carrot')}</button><button class="mini-guide" data-go="cost"><span><h3>算一算，每份多少钱</h3><p>吃得完，才是真的划算</p></span>${food('eggs')}</button></div></section></div><aside class="aside"><section class="panel right-panel"><div class="calendar-head"><h2>我的提醒日历</h2><span class="small" style="font-size:10px">${date.getMonth()+1} 月</span></div><p class="sub">把每一份新鲜，排进日程里</p><div class="week">${[-2,-1,0,1,2,3,4].map(d=>{let x=new Date(shift(d)+'T12:00:00');return`<button class="day ${d===0?'active':''}" data-action="calendar" data-date="${shift(d)}"><span>${weekdays[x.getDay()]}</span><b>${x.getDate()}</b></button>`}).join('')}</div><div class="schedule">${sorted().filter(f=>diff(f.remind)<=2).slice(0,3).map(f=>`<div class="schedule-item"><time>${shortDate(f.remind)} · ${db.settings.time}</time><p><button data-go="detail/${f.id}" style="padding:0">记得关注 ${esc(f.name)}</button></p><small>${f.store}保存 · ${esc(f.qty)}</small></div>`).join('')||'<small>近日没有提醒安排</small>'}</div><button class="textbtn" data-go="reminders" style="margin-top:18px">管理我的提醒</button></section><section class="panel right-panel"><h2>我的小冰箱</h2><p class="sub">一眼看清，心里有数</p><div class="fridge-badge">${ic('fridge')}<span><b>${db.foods.length} 种食材，正在好好保存</b><small>冷藏 ${cold} 种 · 冷冻 ${frozen} 种</small></span></div><div class="bar"><span style="width:${db.foods.length?cold/db.foods.length*100:0}%"></span><span style="flex:1"></span></div><div class="legend"><span>冷藏区 ${cold}</span><span>冷冻区 ${frozen}</span></div></section><section class="quicktip"><h3>每次少买一点，刚刚好</h3><p>采购前看看库存，按能吃完的份数买，比单看低价更划算。</p><button class="textbtn" data-go="cost">了解每份实际成本</button>${ic('leaf','leaf')}</section></aside></div>`}
function inventory(){let list=sorted().filter(f=>(filter.store==='全部'||f.store===filter.store)&&(filter.cat==='全部'||f.category===filter.cat)&&(!filter.soon||urgent(f))&&f.name.includes(filter.q));if(filter.sort==='buy')list.sort((a,b)=>b.buy.localeCompare(a.buy));return head('我的冰箱','每一份食材，都值得被记住。',addBtn(),'MY LITTLE FRIDGE')+`<div class="toolbar"><div class="tabs">${['全部','冷藏','冷冻'].map(t=>`<button class="tab ${filter.store===t?'active':''}" data-filter="store" data-value="${t}">${t}${t==='全部'?'食材':''} <small>${t==='全部'?db.foods.length:db.foods.filter(f=>f.store===t).length}</small></button>`).join('')}</div><label class="search">${ic('search')}<input id="food-search" placeholder="搜索冰箱里的食材" value="${esc(filter.q)}" aria-label="搜索食材"></label></div><div class="filters">${['全部','蔬菜水果','肉禽海鲜','蛋奶豆制品','冷冻食品','其他'].map(t=>`<button class="chip ${filter.cat===t?'active':''}" data-filter="cat" data-value="${t}">${t}</button>`).join('')}<button class="chip ${filter.soon?'active':''}" data-action="toggleSoon">${ic('clock')} 优先关注</button><select id="food-sort" class="select-input" style="margin-left:auto" aria-label="排序方式"><option value="remind" ${filter.sort==='remind'?'selected':''}>按提醒时间</option><option value="buy" ${filter.sort==='buy'?'selected':''}>按最近购入</option></select></div><div class="food-grid" id="food-results">${list.length?list.map(foodCard).join(''):empty('这里还没有食材','试试其他筛选条件，或记录新买的食材。',addBtn())}</div><div class="section-space">${note()}</div><p class="demo-label">首次打开显示示例库存；可添加、修改和删除，数据保存在当前浏览器。</p>`}
function foodCard(f){let s=status(f);return`<button class="food-card" data-go="detail/${f.id}"><div class="food-picture" style="background:${f.type==='tomato'?'#f8efe8':f.type==='eggs'?'#f6f2e6':f.type==='chicken'?'#f6ece5':'#f0f4e8'}"><span class="pill">${f.store==='冷冻'?'持续冷冻':f.category}</span>${food(f.type)}</div><div class="food-body"><h3>${esc(f.name)}${f.priority?'<span class="pill orange">优先</span>':''}</h3><p>${esc(f.qty)} · ${f.store} · ${f.condition}</p><div class="bottom"><span class="pill ${s.cls}">${s.label}</span><span style="color:#a5b19f">${shortDate(f.remind)}</span></div></div></button>`}
function detail(id){const f=db.foods.find(f=>f.id===id);if(!f)return missing();const s=status(f);return head(esc(f.name),'食材详情 · 每一次认真记录，都让生活更从容。',`<button class="btn secondary" data-go="inventory">${ic('back')}返回冰箱</button>`,'FOOD DETAILS')+`<div class="detail-layout"><div><div class="detail-visual">${food(f.type)}<span class="overline">KEEP IT FRESH · MAKE IT COUNT</span></div><section class="panel detail-block section-space"><h2>这份食材的小档案</h2><div class="detail-dl">${[['购入日期',shortDate(f.buy)],['存放数量',f.qty],['储存方式',f.store],['食材状态',f.condition],['购买金额',f.price!==''&&f.price!=null?'¥ '+Number(f.price).toFixed(2):'未填写'],['预计份数',f.portions?f.portions+' 份':'未填写']].map(([l,v])=>`<div><label>${l}</label><b>${esc(v)}</b></div>`).join('')}</div>${f.note?`<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:16px"><small>我的备注</small><p class="prose">${esc(f.note)}</p></div>`:''}</section></div><div><div class="status-box"><span class="pill ${s.cls}">${s.label}</span><h2 style="margin-top:12px">${shortDate(f.remind)}，记得关注它</h2><p>已设提醒时间：${db.settings.time} · ${db.settings.reminders?'页面内提醒已开启':'提醒已关闭'}</p></div>${note()}<div class="actions"><button class="btn primary" data-action="consume" data-id="${id}">${ic('check')}记录食用</button><button class="btn secondary" data-go="edit/${id}">${ic('edit')}编辑记录</button></div><section class="panel detail-block"><div class="settings-item" style="padding-top:0"><span><h3>优先处理</h3><p>将这份食材置顶，方便先安排</p></span><button class="switch ${f.priority?'on':''}" data-action="priority" data-id="${id}" role="switch" aria-checked="${f.priority}" aria-label="优先处理"><i></i></button></div><button class="textbtn" data-action="discard" data-id="${id}" style="color:#b88b74;margin-top:17px">${ic('trash')} 记录丢弃</button><button class="textbtn" data-action="delete" data-id="${id}" style="display:block;margin-top:17px">删除这条记录</button></section>${f.price!==''&&f.price!=null&&f.portions?`<section class="panel detail-block"><small>预计每份成本</small><h2 style="font-size:28px;color:var(--green);margin:5px 0">¥ ${(f.price/f.portions).toFixed(2)} <small>/ 份</small></h2><p class="small">基于预计 ${f.portions} 份计算，真实成本需结合实际食用记录。</p><button class="textbtn" data-go="cost" style="margin-top:12px">试试成本计算器</button></section>`:''}<button class="btn soft" data-go="recipes">${ic('bowl')}用现有食材，找点搭配灵感</button></div></div>`}
function missing(){return empty('这条记录已不存在','返回冰箱查看其他食材。',`<button class="btn primary" data-go="inventory">返回我的冰箱</button>`)}
function form(id){const f=db.foods.find(f=>f.id===id);if(id&&!f)return missing();const v=f||{name:'',qty:'',category:'蔬菜水果',type:'cabbage',store:'冷藏',condition:'完整',buy:today(),remind:shift(3),price:'',portions:'',note:''};return head(f?'编辑食材记录':'记录一份新鲜',f?'更改储存方式或食材状态后，请重新确认提醒日期。':'先记下来，下次打开冰箱就心里有数。',`<button class="btn secondary" data-go="${f?'detail/'+id:'inventory'}">取消</button>`,'ADD A LITTLE FRESHNESS')+`<form id="food-form" class="panel form-panel" data-id="${id||''}"><div class="form-grid"><div class="field full"><label for="name">食材名称 *</label><input id="name" name="name" maxlength="30" required placeholder="例如：番茄、鸡胸肉" value="${esc(v.name)}"></div><div class="field"><label for="category">食材分类</label><select id="category" name="category">${['蔬菜水果','肉禽海鲜','蛋奶豆制品','冷冻食品','其他'].map(x=>`<option ${v.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="qty">数量 / 重量 *</label><input id="qty" name="qty" required maxlength="30" placeholder="例如：3 个、500 克" value="${esc(v.qty)}"></div><div class="field"><label for="buy">购买日期 *</label><input type="date" id="buy" name="buy" required max="${today()}" value="${v.buy}"></div><div class="field"><label for="store">储存方式 *</label><select id="store" name="store"><option ${v.store==='冷藏'?'selected':''}>冷藏</option><option ${v.store==='冷冻'?'selected':''}>冷冻</option></select></div><div class="field"><label for="condition">当前食材状态</label><select id="condition" name="condition">${['完整','未开封','已开封','已切分','已解冻'].map(x=>`<option ${v.condition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="remind">提醒日期 *</label><input type="date" id="remind" name="remind" required value="${v.remind}"></div><div class="field full"><div class="notice" id="storage-note">${ic('info')}<span>优先按包装标签设置提醒。无标签食材可先查看保鲜指南，再自行确认日期；示例默认日期不代表建议保存期限。</span></div></div></div><details class="optional" ${(v.price!==''&&v.price!=null)?'open':''}><summary>补充成本信息（选填）</summary><div class="form-grid"><div class="field"><label for="price">购买金额（元）</label><input type="number" min="0" max="99999" step="0.01" id="price" name="price" placeholder="例如：10" value="${v.price??''}"></div><div class="field"><label for="portions">预计可做几份</label><input type="number" min="1" max="999" step="1" id="portions" name="portions" placeholder="例如：3" value="${v.portions??''}"></div></div></details><div class="field"><label for="note">备注（选填）</label><textarea id="note" name="note" rows="2" maxlength="300" placeholder="记一点储存位置、标签日期或食用计划">${esc(v.note)}</textarea></div><div class="actions" style="margin-bottom:0"><button class="btn primary" type="submit">${ic('check')}${f?'保存修改':'放进我的冰箱'}</button><button class="btn secondary" type="button" data-go="guides">查看保鲜指南</button></div><p class="demo-label">保存后将留在当前浏览器，可随时编辑或删除。</p></form>`}
function guideList(){return head('保鲜有方法，备菜有分寸','先看储存条件，再按能吃完的份数买。',`<button class="btn secondary" data-go="cost">${ic('money')}每份成本计算</button>`,'A GUIDE TO STAYING FRESH')+`<div class="toolbar"><div class="tabs">${['全部','冷藏备菜','冷冻储备'].map(x=>`<button class="tab ${guideTab===x?'active':''}" data-guide-tab="${x}">${x}</button>`).join('')}</div><span class="small">依据项目书资料整理 · 核对于 2026.11.25</span></div><div class="guide-grid">${guides.filter(g=>guideTab==='全部'||guideTab===g.cat).map(g=>`<button class="panel guide-card" data-go="guide/${g.id}"><div class="food-picture">${food(g.type)}<span class="pill">${g.cat}</span></div><div class="food-body"><h3>${g.name}</h3><p>${g.desc}</p><div class="guide-meta"><span>${g.store}参考</span><b>${g.time}</b></div></div></button>`).join('')}</div><div class="section-space">${note()}</div><p class="hint">参考范围具有储存条件，不是从购买日重新获得完整保质期；包装标签优先。</p>`}
function guideDetail(id){const g=guides.find(g=>g.id===id);if(!g)return missing();return head(g.name,'保鲜指南 · 理解条件，才能用好参考。',`<button class="btn secondary" data-go="guides">${ic('back')}全部指南</button>`,'STORAGE GUIDE')+`<div class="detail-layout"><div><div class="detail-visual">${food(g.type)}<span class="overline">BUY WHAT YOU NEED · USE WHAT YOU BUY</span></div><div class="panel detail-block section-space"><h2>选购时，先问三个问题</h2><div class="prose"><p>冰箱有合适的储存空间吗？这次买的量能安排进接下来的用餐吗？按可食部分或每份计算，价格是否适合我的预算？</p><p>保存时间只是采购参考之一，不能把“耐放”等同于“更划算”。</p></div><button class="btn soft" data-go="cost">${ic('money')}算一算每份成本</button></div></div><div><section class="panel detail-block"><span class="pill green">${g.condition}</span><h2 style="margin:12px 0 5px">${g.store}参考：${g.time}</h2><p class="small">${g.store==='冷冻'?'条件：持续冷冻不高于 −18℃，时间主要表示品质参考。':'条件：冷藏不高于 4℃，结合标签及既往储存情况。'}</p><div class="prose" style="margin-top:22px"><h3 style="color:var(--text)">怎么保存更有条理</h3><ol>${g.tips.map(t=>`<li>${t}</li>`).join('')}</ol></div><div class="source"><b>资料来源</b><p><a href="${g.url}" target="_blank" rel="noopener">${g.source} · 查看原始资料</a></p><small>核对日期：2026年11月25日。海外家庭储存资料作信息设计参考，实际以产品标签及适用的本地要求为准。</small></div></section>${note()}<div class="actions"><button class="btn primary" data-action="addFromGuide" data-id="${id}">${ic('plus')}记录这类食材</button></div></div></div>`}
function recipeList(){return head('冰箱现有的，也能做点好吃的','围绕库存提供简单搭配，先用需要关注的食材。','','COOK WITH WHAT YOU HAVE')+`<div class="recipe-grid">${recipes.map(r=>{const matched=r.ingredients.filter(n=>db.foods.some(f=>f.name===n));return`<button class="panel recipe-card" data-go="recipe/${r.id}"><div class="recipe-art">${r.types.map(t=>food(t)).join('')}</div><div class="food-body"><span class="pill green">库存匹配 ${matched.length}/${r.ingredients.length}</span><h3 style="margin-top:10px">${r.name}</h3><p>${r.desc}</p><span class="small">${ic('clock')} ${r.time} · 家常搭配</span></div></button>`}).join('')}</div><div class="section-space">${note()}</div>`}
function recipeDetail(id){const r=recipes.find(x=>x.id===id);if(!r)return missing();return head(r.name,r.desc,`<button class="btn secondary" data-go="recipes">全部搭配</button>`,'SIMPLE EVERYDAY COOKING')+`<div class="detail-layout"><div><div class="detail-visual" style="display:flex;justify-content:center">${r.types.map(t=>food(t)).join('')}</div><p class="hint">家常搭配示例 · 调味品按个人习惯准备</p></div><div><section class="panel detail-block"><h2>看看冰箱，准备食材</h2>${r.ingredients.map(n=>{const f=db.foods.find(f=>f.name===n);return`<div class="settings-item"><span><h3>${n}</h3><p>${f?'库存 '+esc(f.qty)+' · '+f.store:'当前库存未记录'}</p></span>${f?`<button class="btn soft" data-go="detail/${f.id}">查看食材</button>`:'<span class="pill orange">需准备</span>'}</div>`}).join('')}</section><section class="panel detail-block"><h2>简单做法</h2><div class="prose"><ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div><small>约 ${r.time}，具体用时随份量和设备变化。</small></section>${note()}</div></div>`}
function cost(){return head('吃得完，才是真的划算','用实际吃到的份数，重新看看这一笔采购。','','MAKE EVERY PORTION COUNT')+`<section class="panel calculator"><div class="cost-grid"><div><h2 style="margin-bottom:20px">每份成本计算器</h2><div class="field"><label for="calc-amount">本次购买金额（元）</label><input id="calc-amount" type="number" min="0" max="999999" value="10" step="0.01"></div><div class="field" style="margin-top:17px"><label for="calc-plan">原本预计份数</label><input id="calc-plan" type="number" min="1" max="9999" value="5" step="1"></div><div class="field" style="margin-top:17px"><label for="calc-actual">最终实际吃到的份数</label><input id="calc-actual" type="number" min="1" max="9999" value="3" step="1"></div><p class="demo-label">这里的 10 元是计算示例，不代表市场价格。</p></div><div><div class="calc-result" id="calc-result"></div><div class="notice" style="margin-top:20px">${ic('leaf')}<span>每份实际成本 = 购买金额 ÷ 实际吃到的份数。先比较同类食材，再结合储存条件、用量与损耗选择。</span></div></div></div></section>`}
function updateCalc(){let amount=Number($('#calc-amount').value),plan=Number($('#calc-plan').value),actual=Number($('#calc-actual').value);$('#calc-result').innerHTML=amount>=0&&plan>0&&actual>0&&Number.isInteger(plan)&&Number.isInteger(actual)?`<small>每份实际食材成本</small><div><strong>¥ ${(amount/actual).toFixed(2)}</strong><span class="small"> / 份</span></div><p style="margin-top:15px">如果全部按计划吃完：¥ ${(amount/plan).toFixed(2)} / 份<br>实际吃到 ${actual} 份，${actual<plan?'剩余部分未计入食用份数':'以实际食用份数计算'}。</p>`:'<p>请输入非负金额及大于零的整数份数。</p>'}
function records(){const eaten=db.records.filter(r=>r.action==='食用').length,discarded=db.records.filter(r=>r.action==='丢弃').length;return head('每一份食材，都有去向','真实记录食用与丢弃，慢慢了解自己的采购习惯。','','LITTLE RECORDS, BETTER HABITS')+`<div class="stats"><div class="stat"><div class="stat-label">记录食用</div><div class="metric">${eaten}<span>次</span></div></div><div class="stat"><div class="stat-label">记录丢弃</div><div class="metric">${discarded}<span>次</span></div></div><div class="stat"><div class="stat-label">食用记录比例</div><div class="metric">${eaten+discarded?Math.round(eaten/(eaten+discarded)*100)+'%':'—'}</div><small>按记录次数统计，不是重量比例</small></div></div>${db.records.length?`<div style="overflow:auto"><table class="records"><thead><tr><th>食材</th><th>去向</th><th>记录数量</th><th>记录时间</th><th>操作</th></tr></thead><tbody>${db.records.map((r,i)=>`<tr><td>${esc(r.name)}</td><td><span class="pill ${r.action==='食用'?'green':'orange'}">${r.action}</span></td><td>${esc(r.qty)}</td><td>${shortDate(r.date)}</td><td><button class="textbtn" data-action="undo" data-id="${i}">撤销</button></td></tr>`).join('')}</tbody></table></div>`:empty('第一份认真记录，从今天开始','进入食材详情，点击“记录食用”或“记录丢弃”。',`<button class="btn primary" data-go="inventory">去看看冰箱</button>`)}<div class="notice section-space">${ic('info')}<span>此处统计已记录次数。尚未按重量与实际份数完整核算，因此不展示真实节约金额。</span></div>`}
function reminders(){const list=sorted();return head('把新鲜，放进提醒里','所有提醒都由你确认的日期决定。',`<button class="btn secondary" data-go="settings">${ic('bell')}提醒设置</button>`,'A GENTLE REMINDER')+`<div class="notice" style="margin-bottom:20px">${ic('info')}<span>这是网页交互原型，提供页面内提醒，不会发送微信订阅消息；正式小程序需接入微信服务并获得授权。${!db.settings.reminders?'当前提醒已关闭，下面仍可查看计划。':''}</span></div><section class="panel">${list.length?list.map(f=>`<div class="notification-row"><span class="badge-icon">${ic('clock')}</span><span><h3>${esc(f.name)} <span class="pill ${status(f).cls}">${status(f).label}</span></h3><p>${shortDate(f.remind)} ${db.settings.time} · ${f.store} · ${esc(f.qty)}</p></span><button class="btn secondary" data-go="detail/${f.id}">查看详情</button></div>`).join(''):empty('还没有提醒计划','添加食材时设置你希望关注它的日期。',addBtn())}</section>`}
function settings(){return head('我的小厨房','把记录变成习惯，把日子过得新鲜。','','YOUR LITTLE KITCHEN')+`<div class="settings-grid"><section class="panel detail-block"><h2>提醒偏好</h2><div class="settings-item"><span><h3>页面内提醒</h3><p>打开页面时展示到期关注提示</p></span><button role="switch" aria-checked="${db.settings.reminders}" aria-label="页面内提醒" class="switch ${db.settings.reminders?'on':''}" data-action="toggleReminder"><i></i></button></div><div class="settings-item"><span><h3>每日提醒时间</h3><p>用于页面内日程展示</p></span><input type="time" id="reminder-time" value="${db.settings.time}" class="select-input" aria-label="每日提醒时间"></div><div class="notice" style="margin-top:15px">${ic('info')}<span>此原型不申请系统通知权限，也不会在页面关闭后推送通知。</span></div></section><section class="panel detail-block"><h2>数据与隐私</h2><p class="prose">库存、操作记录和反馈保存在当前设备浏览器中，无需真实姓名、住址或手机号。更换设备不会自动同步。</p><div class="actions"><button class="btn secondary" data-action="export">导出我的数据</button><button class="btn danger" data-action="reset">恢复示例数据</button></div><button class="textbtn" data-go="feedback">${ic('chat')} 分享你的建议</button></section><section class="panel detail-block"><h2>演示入口</h2><p class="prose">已实现首页、功能列表、详情和编辑四层页面，适合项目展示与答辩操作。</p><button class="btn soft" data-go="flow">${ic('grid')}查看交互层级</button><button class="btn secondary" data-go="records" style="margin-left:8px">消耗记录</button></section></div>`}
function feedback(){return head('你的建议，让鲜记更好用','告诉我们，哪里还可以做得更顺手。','','GROW BETTER, WITH YOU')+`<div class="settings-grid"><form id="feedback-form" class="panel detail-block"><h2>这次体验怎么样？</h2><div id="stars" role="group" aria-label="满意度评价">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=rating?'on':''}" data-rating="${n}" aria-label="${n}星">★</button>`).join('')}</div><div class="field section-space"><label for="feedback-category">反馈类别</label><select id="feedback-category" name="category"><option>操作体验</option><option>提醒设置</option><option>食材指南</option><option>功能建议</option><option>其他问题</option></select></div><div class="field" style="margin-top:18px"><label for="feedback-text">想对我们说 *</label><textarea id="feedback-text" name="message" rows="5" maxlength="1000" required placeholder="例如：希望添加食材时能更快选择常用名称。"></textarea></div><button type="submit" class="btn primary" style="margin-top:20px">保存反馈</button><p class="demo-label">体验版反馈仅保存在本机，未发送至服务端。已保存 ${db.feedback.length} 条。</p></form><section class="panel detail-block"><h2>你更期待哪个功能？</h2><p class="small" style="margin-bottom:20px">投票会在本机保留，可再次点击取消。</p>${['家庭成员共享冰箱','常用食材快捷录入','每周采购清单'].map(x=>`<div class="settings-item"><h3>${x}</h3><button class="btn ${db.votes.includes(x)?'soft':'secondary'}" data-vote="${x}">${db.votes.includes(x)?'已投票':'投一票'}</button></div>`).join('')}</section></div>`}
function flow(){return head('从首页出发，走进每一层功能','所有方块均可点击，演示时可直接跳转到相应页面。','','INTERACTIVE PROTOTYPE MAP')+`<div class="flow-grid"><section class="panel flow-card"><div class="level">一级 · 总览与入口</div><h2>看见今天的新鲜</h2><button data-go="home">今日概览</button><p>库存统计、优先关注、提醒日历和快捷入口。</p></section><section class="panel flow-card"><div class="level">二级 · 功能列表</div><h2>找到想管理的内容</h2><button data-go="inventory">我的冰箱 · 筛选与搜索</button><button data-go="guides">保鲜指南 · 分类浏览</button><button data-go="recipes">搭配灵感 · 库存匹配</button><button data-go="reminders">提醒中心 · 日期计划</button><button data-go="records">消耗记录 · 食用与丢弃</button><button data-go="settings">我的 · 设置与隐私</button></section><section class="panel flow-card"><div class="level">三级 · 详情与操作</div><h2>查看信息，完成操作</h2><button data-go="${db.foods[0]?'detail/'+db.foods[0].id:'add'}">食材详情 · 食用 / 丢弃 / 置顶</button><button data-go="guide/carrot">指南详情 · 条件与资料来源</button><button data-go="recipe/r1">搭配详情 · 食材与做法</button><button data-go="cost">每份成本 · 实时计算</button><button data-go="feedback">反馈 · 星级评价与投票</button></section></div><section class="panel detail-block section-space"><span class="pill green">四级 · 表单与确认</span><h2 style="margin-top:12px">把流程走完整</h2><p class="prose">首页 → 我的冰箱 → 食材详情 → 编辑记录 → 保存；食材详情 → 记录食用 → 确认数量 → 消耗记录。页面顶部面包屑和浏览器返回键均可返回上级。</p><div class="actions"><button class="btn primary" data-go="add">体验添加食材</button><button class="btn secondary" data-go="inventory">从冰箱清单开始</button></div><p class="small">本原型根据《鲜记——冰箱食材保鲜提醒小程序》项目书制作，核心为“记录—查看—提醒”，支持桌面和手机浏览。</p></section>`}
function render(){const{page,id}=current();const pages={home,inventory,detail:()=>detail(id),add:()=>form(''),edit:()=>form(id),guides:guideList,guide:()=>guideDetail(id),recipes:recipeList,recipe:()=>recipeDetail(id),cost,records,reminders,settings,feedback,flow};$('#app').innerHTML=shell((pages[page]||home)());if(page==='cost')updateCalc();document.title=(page==='home'?'鲜记':({inventory:'我的冰箱',detail:'食材详情',guides:'保鲜指南',add:'添加食材',flow:'原型导览'}[page]||'鲜记'))+' · 好好吃饭，不负新鲜'}
function modal(html){$('#overlay').innerHTML=`<div class="modal-wrap" role="dialog" aria-modal="true"><section class="modal">${html}</section></div>`;setTimeout(()=>$('#overlay button')?.focus(),50)}
const closeModal=()=>$('#overlay').innerHTML='';
function useModal(id,action){const f=db.foods.find(f=>f.id===id);if(!f)return;modal(`<h2>${action==='食用'?'好好享用这一份新鲜':'记录这份食材的去向'}</h2><p>${esc(f.name)} · 当前库存 ${esc(f.qty)}。确认后整条记录将移入消耗记录；如果只用了一部分，请填写剩余数量。</p><form id="use-form" data-id="${id}" data-action="${action}"><div class="field"><label for="used-qty">本次${action}数量 *</label><input id="used-qty" name="qty" value="${esc(f.qty)}" maxlength="30" required></div><div class="field" style="margin-top:16px"><label for="remaining-qty">剩余数量（全部处理完请留空）</label><input id="remaining-qty" name="remaining" maxlength="30" placeholder="例如：2 个、200 克"></div><div class="actions"><button type="button" class="btn secondary" data-action="close">取消</button><button class="btn primary" type="submit">确认记录${action}</button></div></form>`)}
function inferType(name,category){return /蛋/.test(name)?'eggs':/番茄|西红柿/.test(name)?'tomato':/胡萝卜/.test(name)?'carrot':/玉米/.test(name)?'corn':/鸡|肉/.test(name)?'chicken':/奶/.test(name)?'milk':/菠菜|青菜/.test(name)?'spinach':/西兰花/.test(name)?'broccoli':'cabbage'}
document.addEventListener('click',e=>{const target=e.target.closest('button,[data-go]');if(!target)return;if(target.dataset.go){go(target.dataset.go);return}if(target.dataset.filter){filter[target.dataset.filter]=target.dataset.value;render();return}if(target.dataset.guideTab){guideTab=target.dataset.guideTab;render();return}if(target.dataset.rating){rating=Number(target.dataset.rating);$('#stars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=rating?'on':''}" data-rating="${n}" aria-label="${n}星">★</button>`).join('');return}if(target.dataset.vote){let x=target.dataset.vote;db.votes=db.votes.includes(x)?db.votes.filter(v=>v!==x):[...db.votes,x];save();render();return}const a=target.dataset.action,id=target.dataset.id;const f=db.foods.find(f=>f.id===id);if(a==='soon'){filter={store:'全部',cat:'全部',q:'',soon:true,sort:'remind'};go('inventory')}if(a==='toggleSoon'){filter.soon=!filter.soon;render()}if(a==='calendar'){const date=target.dataset.date;const fs=db.foods.filter(f=>f.remind===date);modal(`<h2>${shortDate(date)}的提醒</h2><p>${fs.length?'当天安排了以下食材：':'当天没有设置食材提醒。'}</p>${fs.map(foodRow).join('')}<div class="actions"><button class="btn secondary" data-action="close">关闭</button><button class="btn primary" data-go="reminders" data-action="close">查看全部提醒</button></div>`)}if(a==='priority'&&f){f.priority=!f.priority;save();render();toast(f.priority?'已设为优先处理':'已取消优先处理')}if(a==='consume')useModal(id,'食用');if(a==='discard')useModal(id,'丢弃');if(a==='delete'&&f)modal(`<h2>删除“${esc(f.name)}”的记录？</h2><p>删除不会计入食用或丢弃统计。确认后将从冰箱清单移除。</p><div class="actions"><button class="btn secondary" data-action="close">取消</button><button class="btn danger" data-action="confirmDelete" data-id="${id}">确认删除</button></div>`);if(a==='confirmDelete'){db.foods=db.foods.filter(x=>x.id!==id);save();closeModal();go('inventory');toast('记录已删除')}if(a==='close')closeModal();if(a==='toggleReminder'){db.settings.reminders=!db.settings.reminders;save();render();toast(db.settings.reminders?'已开启页面内提醒':'已关闭页面内提醒')}if(a==='reset')modal('<h2>恢复最初的示例数据？</h2><p>当前浏览器的库存、消耗记录和反馈会被清除，并恢复 8 种示例食材。你可以先在设置中导出数据。</p><div class="actions"><button class="btn secondary" data-action="close">取消</button><button class="btn danger" data-action="confirmReset">确认恢复</button></div>');if(a==='confirmReset'){db={foods:seeds(),records:[],feedback:[],settings:{reminders:true,time:'09:00'},votes:[]};save();closeModal();go('home');toast('已恢复示例库存')}if(a==='undo'){let i=Number(id),r=db.records[i];if(r){let currentFood=db.foods.find(f=>f.id===r.original.id);if(currentFood){modal(`<h2>撤销这次${r.action}记录？</h2><p>该食材仍有剩余库存。撤销会将库存恢复到此次操作前的数量“${esc(r.original.qty)}”，请确认没有后续数量变更。</p><div class="actions"><button class="btn secondary" data-action="close">取消</button><button class="btn primary" data-action="confirmUndo" data-id="${i}">确认恢复</button></div>`)}else{db.foods.push(r.original);db.records.splice(i,1);save();render();toast('已撤销，食材恢复至冰箱')}}}if(a==='confirmUndo'){let i=Number(id),r=db.records[i];db.foods=db.foods.filter(f=>f.id!==r.original.id);db.foods.push(r.original);db.records.splice(i,1);save();closeModal();render();toast('已恢复操作前的库存')}if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='鲜记数据_'+today()+'.json';el.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('数据文件已导出')}if(a==='addFromGuide'){const g=guides.find(x=>x.id===id);go('add');setTimeout(()=>{if($('#name')){$('#name').value=g.name;$('#store').value=g.store;$('#category').value=g.type==='chicken'?'肉禽海鲜':g.type==='eggs'?'蛋奶豆制品':g.store==='冷冻'?'冷冻食品':'蔬菜水果';$('#remind').value='';$('#remind').focus();toast('请结合标签和实际状态确认提醒日期')}},50)}});
document.addEventListener('submit',e=>{if(e.target.id==='food-form'){e.preventDefault();const form=e.target,data=new FormData(form),id=form.dataset.id,old=db.foods.find(f=>f.id===id);const name=data.get('name').trim(),qty=data.get('qty').trim();if(!name||!qty){toast('请填写食材名称和数量');return}if(data.get('remind')<data.get('buy')){toast('提醒日期不能早于购买日期');return}const item={id:old?.id||'f'+Date.now(),name,qty,category:data.get('category'),store:data.get('store'),condition:data.get('condition'),buy:data.get('buy'),remind:data.get('remind'),price:data.get('price')===''?'':Number(data.get('price')),portions:data.get('portions')===''?'':Number(data.get('portions')),note:data.get('note').trim(),priority:old?.priority||false,type:inferType(name,data.get('category'))};if(old)db.foods=db.foods.map(f=>f.id===id?item:f);else db.foods.push(item);save();go('detail/'+item.id);toast(old?'食材记录已更新':'新鲜已入库，提醒日期已记录')}if(e.target.id==='use-form'){e.preventDefault();const form=e.target,d=new FormData(form),id=form.dataset.id,f=db.foods.find(f=>f.id===id),qty=d.get('qty').trim(),remaining=d.get('remaining').trim();if(!qty){toast('请填写本次处理数量');return}db.records.unshift({name:f.name,qty,action:form.dataset.action,date:today(),original:{...f}});if(remaining)f.qty=remaining;else db.foods=db.foods.filter(x=>x.id!==id);save();closeModal();go('records');toast('已记录'+form.dataset.action)}if(e.target.id==='feedback-form'){e.preventDefault();const d=new FormData(e.target);if(!d.get('message').trim()){toast('请填写反馈内容');return}db.feedback.push({rating,category:d.get('category'),message:d.get('message').trim(),date:today()});save();render();toast('反馈已保存在当前浏览器，谢谢你的建议')}});
document.addEventListener('input',e=>{if(e.target.id==='food-search'){const pos=e.target.selectionStart;filter.q=e.target.value;const list=sorted().filter(f=>(filter.store==='全部'||f.store===filter.store)&&(filter.cat==='全部'||f.category===filter.cat)&&(!filter.soon||urgent(f))&&f.name.includes(filter.q));if(filter.sort==='buy')list.sort((a,b)=>b.buy.localeCompare(a.buy));$('#food-results').innerHTML=list.length?list.map(foodCard).join(''):empty('没有找到这份食材','换个名称试试，或点击添加食材。',addBtn())}if(e.target.id.startsWith('calc-'))updateCalc()});
document.addEventListener('change',e=>{if(e.target.id==='food-sort'){filter.sort=e.target.value;render()}if(e.target.id==='reminder-time'){if(e.target.value){db.settings.time=e.target.value;save();toast('提醒时间已更新')}}if(['store','condition'].includes(e.target.id)&&$('#storage-note')){$('#storage-note').innerHTML=ic('info')+'<span>储存方式或状态已更改，请重新确认提醒日期。冷藏与冷冻期限不能混用，解冻、开封或切分后不能简单沿用原日期。</span>';$('#remind').value=''}});
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();save();
</script></body></html>
